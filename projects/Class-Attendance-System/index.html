<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂点名抽取系统</title>
    <style>
        :root {
            --primary: #cb4042;
            --accent: #a3813f;
            --danger: #c04b47;
            --bg: #fffdf8;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .main-card {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        h2 { text-align: center; color: #26324e; margin-top: 0; }
        .input-section { margin-bottom: 20px; }
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; color: #6b6560; }
        .count-tag { background: var(--primary); color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.85rem; }
        select, textarea, input[type="number"] { width: 100%; padding: 12px; border: 2px solid #f6f2e9; border-radius: 10px; font-size: 1rem; box-sizing: border-box; transition: all 0.3s; }
        textarea { height: 120px; resize: none; line-height: 1.6; }
        select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(203, 64, 66, 0.12); }
        .control-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; margin-top: 15px; }
        
        button { padding: 12px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: transform 0.1s, background 0.3s; }
        #startBtn { background: var(--primary); color: white; }
        #startBtn.running { background: var(--danger); }
        button:active { transform: scale(0.98); }

        /* 闪动动画区域 - 调高了高度以适应大字号 */
        .display-area { 
            height: 180px; 
            margin: 20px 0; 
            background: #fffdf8; 
            border: 2px dashed #ded7c6; 
            border-radius: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }

        /* 滚动时的字号 */
        .rolling-text { 
            font-size: 2.8rem; 
            font-weight: 800; 
            color: var(--accent); 
            text-shadow: 1px 1px 0px #fff, 2px 2px 10px rgba(0,0,0,0.1); 
            animation: flashAnim 0.1s infinite alternate; 
        }

        @keyframes flashAnim { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.05); opacity: 1; } }

        /* 最终显示名字的样式 - 调大了字号 */
        .result-item { 
            display: inline-block; 
            background: #f6f2e9; 
            margin: 8px; 
            padding: 10px 25px; 
            border-radius: 12px; 
            border-left: 6px solid var(--primary); 
            font-weight: 900; 
            font-size: 3.5rem;  /* 这里修改字号 */
            color: #26324e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .history { font-size: 0.9rem; color: #8b8577; border-top: 1px solid #f6f2e9; padding-top: 15px; }
        #historyList { max-height: 100px; overflow-y: auto; margin-top: 5px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="main-card">
    <h2>👨‍🏫 课堂随机点名</h2>

    <div class="input-section">
        <div class="label-row">选择班级</div>
        <select id="classSelect" onchange="changeClass()">
            <option value="class2">二班</option>
            <option value="class10">十班</option>
            <option value="custom">自定义录入</option>
        </select>
    </div>

    <div class="input-section">
        <div class="label-row">
            名单输入 (每行一个姓名)
            <span class="count-tag">人数: <span id="personCount">0</span></span>
        </div>
        <textarea id="nameList" placeholder="请在这里输入学生姓名..." oninput="updateCount()"></textarea>
    </div>

    <div class="control-grid">
        <input type="number" id="pickNum" value="1" min="1" placeholder="抽取人数">
        <button id="startBtn" onclick="toggle()">开始点名</button>
    </div>

    <div class="display-area" id="displayBox">
        <div style="color: #b3ab9c;">等待抽取</div>
    </div>

    <div class="history" id="historyBox">
        <strong id="historyTitle">二班最近记录：</strong>
        <div id="historyList">暂无</div>
    </div>
</div>

<script id="dataScript">
    // 【名单内置区域】
    const storage = {
        class2: "陈浏阳\n戴士杰\n邓杰文\n邓梦冉\n董书菡\n樊梦茹\n房祖铭\n耿铭泽\n韩果\n郝家睦\n郝文\n何佳颖\n贾春磊\n雷雨生\n李涵\n李和远\n连星宇\n刘宸熙\n刘可欣\n刘梦锦\n吕保青\n吕思颖\n马祥腾\n孟思琪\n穆韵寒\n潘嘉荟\n孙贯聪\n王若晨\n王烁\n王玉川\n王泽华\n王中宇\n王子钰\n谢金峰\n谢雨晴\n许逸宸\n闫嘉豪\n杨舒童\n杨思雨\n游祯臻\n余睿涵\n袁林浩\n张朋琦\n张胜博\n张雅茜\n张耀辉\n张艺泷\n张智昊\n张智硕\n赵刚强\n赵家祥\n赵家英\n赵梦茹\n郑子琪\n周宇轩\n邹思源", 
        class10: "郭志轩\n杨诗涵\n杨翔森\n崔博帆\n李然\n韩熙雯\n马墨涵\n兰天翔\n赵思媛\n韦铭凯\n张睿\n曹康\n谷东阳\n许仕豪\n张浩贤\n骆启莹\n常乐慧\n张雨馨\n姜瑜\n代真真\n温纪承\n邢炜晨\n周梦婷\n李歆雨\n王思凡\n李思齐\n郭懿达\n刘婧雅\n乔昊宇\n孙雅轩\n李钰\n王锦福\n韩啟昌\n王博雨\n张笑颜\n李晨溪\n杜雨霏\n申冬阳\n赵梦想\n张宇\n房家豪\n任祉静\n肖文翰\n李长运\n时健豪\n王一惠\n汤一凝\n樊昊哲\n朱易\n高伟哲\n黎芮菡\n颜暖晴\n乔一航\n张嘉庆\n程晤芳\n陈裕\n肖鹏程\n闻雅菡\n李淑萁\n王梓鑫", 
        custom: ""
    };
</script>

<script>
    let timer = null;
    let isRunning = false;
    // 历史记录与班级绑定
    const classHistory = { class2: [], class10: [], custom: [] };

    window.onload = function() {
        changeClass();
    };

    function changeClass() {
        const currentClass = document.getElementById('classSelect').value;
        const classNameText = document.getElementById('classSelect').options[document.getElementById('classSelect').selectedIndex].text;
        
        // 切换名单
        document.getElementById('nameList').value = storage[currentClass];
        // 切换历史标题
        document.getElementById('historyTitle').innerText = classNameText + "最近记录：";
        
        updateCount();
        updateHistoryDisplay();
        document.getElementById('displayBox').innerHTML = '<div style="color: #b3ab9c;">等待抽取</div>';
    }

    function updateCount() {
        const names = getRawNames();
        document.getElementById('personCount').innerText = names.length;
        const currentClass = document.getElementById('classSelect').value;
        storage[currentClass] = document.getElementById('nameList').value;
    }

    function getRawNames() {
        return document.getElementById('nameList').value.split('\n').map(n => n.trim()).filter(n => n !== "");
    }

    function toggle() {
        const names = getRawNames();
        const pickCount = parseInt(document.getElementById('pickNum').value) || 1;
        const btn = document.getElementById('startBtn');
        const display = document.getElementById('displayBox');

        if (names.length === 0) { alert("请先输入名单！"); return; }
        if (pickCount > names.length) { alert("抽取人数不能超过总人数！"); return; }

        if (!isRunning) {
            isRunning = true;
            btn.innerText = "中 止";
            btn.classList.add('running');
            timer = setInterval(() => {
                const randomSample = shuffle([...names]).slice(0, pickCount);
                display.innerHTML = `<div class="rolling-text">${randomSample.join(' ')}</div>`;
            }, 60);
        } else {
            clearInterval(timer);
            isRunning = false;
            btn.innerText = "开始点名";
            btn.classList.remove('running');
            const finalPicks = shuffle([...names]).slice(0, pickCount);
            display.innerHTML = '<div>' + finalPicks.map(n => `<span class="result-item">${n}</span>`).join('') + '</div>';
            addHistory(finalPicks);
        }
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function addHistory(picks) {
        const currentClass = document.getElementById('classSelect').value;
        const time = new Date().toLocaleTimeString();
        const entry = `<div><small>${time}</small> 抽取: ${picks.join(', ')}</div>`;
        classHistory[currentClass].unshift(entry);
        updateHistoryDisplay();
    }

    function updateHistoryDisplay() {
        const currentClass = document.getElementById('classSelect').value;
        const list = document.getElementById('historyList');
        if (classHistory[currentClass].length === 0) {
            list.innerHTML = "暂无";
        } else {
            list.innerHTML = classHistory[currentClass].join('');
        }
    }
</script>

</body>
</html>
