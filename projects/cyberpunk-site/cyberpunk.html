<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO TOKYO 2077 // 赛博朋克</title>
<style>
  :root {
    --neon-pink: #ad5f86;
    --neon-cyan: #e2718f;
    --neon-yellow: #b07b32;
    --neon-purple: #9d8cd8;
    --bg-dark: #fdf4f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-dark);
    font-family: 'Courier New', monospace;
    color: var(--neon-cyan);
    overflow-x: hidden;
    min-height: 100vh;
    position: relative;
  }

  /* 透视网格背景 */
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(226, 113, 143, 0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(226, 113, 143, 0.15) 1px, transparent 1px);
    background-size: 50px 50px;
    transform: perspective(500px) rotateX(60deg) scale(2.2) translateY(30%);
    transform-origin: top;
    animation: gridMove 3s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes gridMove {
    from { background-position: 0 0; }
    to   { background-position: 0 50px; }
  }

  /* 扫描线 */
  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(190, 130, 150, 0.08) 0px,
      rgba(190, 130, 150, 0.08) 1px,
      transparent 2px,
      transparent 4px
    );
    pointer-events: none;
    z-index: 99;
  }

  /* 扫描光束 */
  .scan-beam {
    position: fixed;
    top: -20%;
    left: 0;
    width: 100%;
    height: 120px;
    background: linear-gradient(180deg, transparent, rgba(173, 95, 134, 0.12), transparent);
    animation: beam 6s ease-in-out infinite;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes beam {
    0%, 100% { top: -20%; }
    50% { top: 110%; }
  }

  /* 故障噪点 */
  .glitch-noise {
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 98;
    animation: noise 0.4s steps(4) infinite;
  }
  @keyframes noise {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-3px, 2px); }
    50% { transform: translate(2px, -3px); }
    75% { transform: translate(-2px, -2px); }
    100% { transform: translate(3px, 3px); }
  }

  header {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    border-bottom: 1px solid rgba(226, 113, 143, 0.3);
    backdrop-filter: blur(4px);
  }

  .logo {
    font-size: 1.4rem;
    font-weight: bold;
    color: var(--neon-pink);
    text-shadow: 0 0 10px var(--neon-pink), 0 0 30px var(--neon-pink);
    letter-spacing: 3px;
  }

  nav { display: flex; gap: 30px; }
  nav a {
    color: var(--neon-cyan);
    text-decoration: none;
    letter-spacing: 2px;
    font-size: 0.9rem;
    position: relative;
    transition: 0.3s;
  }
  nav a:hover {
    color: var(--neon-yellow);
    text-shadow: 0 0 10px var(--neon-yellow);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    letter-spacing: 2px;
  }
  .status-dot {
    width: 8px; height: 8px;
    background: #00ff9f;
    border-radius: 50%;
    box-shadow: 0 0 10px #00ff9f;
    animation: blink 1.5s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  main {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 70px);
    padding: 60px 20px;
    text-align: center;
  }

  /* 故障文字效果 */
  .glitch {
    font-size: clamp(3rem, 10vw, 7rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    color: #fff;
    position: relative;
    text-shadow: 0 0 20px rgba(226, 113, 143, 0.8);
  }
  .glitch::before, .glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    overflow: hidden;
  }
  .glitch::before {
    color: var(--neon-pink);
    z-index: -1;
    animation: glitchShift 3s infinite linear alternate-reverse;
  }
  .glitch::after {
    color: var(--neon-cyan);
    z-index: -2;
    animation: glitchShift 2.5s infinite linear alternate;
  }
  @keyframes glitchShift {
    0% { transform: translate(-4px, 2px); clip-path: inset(20% 0 60% 0); }
    20% { transform: translate(4px, -2px); clip-path: inset(60% 0 10% 0); }
    40% { transform: translate(-3px, -3px); clip-path: inset(10% 0 70% 0); }
    60% { transform: translate(5px, 3px); clip-path: inset(50% 0 30% 0); }
    80% { transform: translate(-5px, 1px); clip-path: inset(30% 0 40% 0); }
    100% { transform: translate(3px, -1px); clip-path: inset(70% 0 5% 0); }
  }

  .subtitle {
    margin-top: 30px;
    font-size: 1.1rem;
    letter-spacing: 8px;
    color: var(--neon-purple);
    text-shadow: 0 0 12px var(--neon-purple);
    animation: fadeIn 2s ease;
  }

  .desc {
    margin-top: 25px;
    max-width: 620px;
    line-height: 1.9;
    font-size: 0.95rem;
    color: rgba(226, 113, 143, 0.7);
    letter-spacing: 1px;
  }

  .buttons {
    margin-top: 50px;
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    padding: 14px 36px;
    font-family: inherit;
    font-size: 0.95rem;
    letter-spacing: 3px;
    cursor: pointer;
    background: transparent;
    border: 1px solid;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    transition: all 0.3s;
    text-transform: uppercase;
  }
  .btn-pink {
    color: var(--neon-pink);
    border-color: var(--neon-pink);
  }
  .btn-pink:hover {
    background: var(--neon-pink);
    color: #000;
    box-shadow: 0 0 25px var(--neon-pink), inset 0 0 15px rgba(190,130,150,0.08);
  }
  .btn-cyan {
    color: var(--neon-cyan);
    border-color: var(--neon-cyan);
  }
  .btn-cyan:hover {
    background: var(--neon-cyan);
    color: #000;
    box-shadow: 0 0 25px var(--neon-cyan), inset 0 0 15px rgba(190,130,150,0.08);
  }

  /* 数据卡片 */
  .cards {
    margin-top: 70px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    width: min(900px, 90%);
  }
  .card {
    background: rgba(253, 244, 247, 0.8);
    border: 1px solid rgba(226, 113, 143, 0.35);
    padding: 28px 20px;
    position: relative;
    transition: 0.3s;
    clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
  }
  .card:hover {
    border-color: var(--neon-pink);
    box-shadow: 0 0 25px rgba(173, 95, 134, 0.35);
    transform: translateY(-5px);
  }
  .card h3 {
    color: var(--neon-pink);
    letter-spacing: 4px;
    font-size: 0.9rem;
    margin-bottom: 15px;
    text-shadow: 0 0 8px var(--neon-pink);
  }
  .card .num {
    font-size: 2.2rem;
    color: #fff;
    text-shadow: 0 0 15px var(--neon-cyan);
  }
  .card p {
    margin-top: 10px;
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 1px;
  }

  footer {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 30px;
    border-top: 1px solid rgba(226, 113, 143, 0.2);
    font-size: 0.75rem;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.35);
  }

  /* 弹窗 */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(253, 244, 247, 0.9);
    align-items: center;
    justify-content: center;
  }
  .modal.active { display: flex; }
  .modal-box {
    background: var(--bg-dark);
    border: 1px solid var(--neon-cyan);
    box-shadow: 0 0 40px rgba(226, 113, 143, 0.4);
    padding: 45px 50px;
    max-width: 460px;
    text-align: left;
    position: relative;
    animation: modalIn 0.3s ease;
  }
  @keyframes modalIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-box h2 {
    color: var(--neon-pink);
    letter-spacing: 4px;
    margin-bottom: 18px;
    font-size: 1.1rem;
    text-shadow: 0 0 10px var(--neon-pink);
  }
  .modal-box p {
    color: var(--neon-cyan);
    line-height: 1.8;
    font-size: 0.9rem;
    opacity: 0.85;
  }
  .modal-close {
    position: absolute;
    top: 10px; right: 16px;
    background: none;
    border: none;
    color: var(--neon-pink);
    font-size: 1.5rem;
    cursor: pointer;
    font-family: inherit;
  }

  /* 打字机 */
  .type-cursor::after {
    content: "▮";
    animation: blink 1s step-end infinite;
    color: var(--neon-yellow);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="scan-beam"></div>
<div class="scanlines"></div>
<div class="glitch-noise"></div>

<header>
  <div class="logo">◈ NEON.CITY</div>
  <nav>
    <a href="#">首页</a>
    <a href="#">数据</a>
    <a href="#">义体</a>
    <a href="#">网络</a>
  </nav>
  <div class="status">
    <span class="status-dot"></span>
    <span>SYS.ONLINE</span>
  </div>
</header>

<main>
  <h1 class="glitch" data-text="赛博朋克 2077">赛博朋克 2077</h1>
  <p class="subtitle">WELCOME TO THE FUTURE // 接入网络</p>
  <p class="desc type-cursor" id="typewriter"></p>

  <div class="buttons">
    <button class="btn btn-pink" id="btnAccess">接入网络</button>
    <button class="btn btn-cyan" id="btnInfo">系统信息</button>
  </div>

  <div class="cards">
    <div class="card">
      <h3>义体使用者</h3>
      <div class="num" id="count1">0</div>
      <p>CYBERWARE USERS</p>
    </div>
    <div class="card">
      <h3>网络接入点</h3>
      <div class="num" id="count2">0</div>
      <p>NETWORK NODES</p>
    </div>
    <div class="card">
      <h3>悬赏任务</h3>
      <div class="num" id="count3">0</div>
      <p>BOUNTY CONTRACTS</p>
    </div>
  </div>
</main>

<footer>
  © 2077 NEON.CITY // 所有数据均经过加密传输 // MADE IN NIGHT CITY
</footer>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">×</button>
    <h2 id="modalTitle">// 系统提示</h2>
    <p id="modalText"></p>
  </div>
</div>

<script>
  const text = "欢迎来到夜之城。在这里，科技与肉体融合，霓虹照亮永夜，数据即力量。接入你的神经接口，开始探索这个由企业统治的未来世界。";
  const typeEl = document.getElementById('typewriter');
  let i = 0;
  function type() {
    if (i < text.length) {
      typeEl.textContent += text[i++];
      setTimeout(type, 55);
    }
  }
  setTimeout(type, 1500);

  function animateCount(id, target, duration) {
    const el = document.getElementById(id);
    const start = performance.now();
    function tick(now) {
      const p = Math.min((now - start) / duration, 1);
      el.textContent = Math.floor(target * p).toLocaleString();
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  animateCount('count1', 482930, 2500);
  animateCount('count2', 12847, 2500);
  animateCount('count3', 9999, 2500);

  const modal = document.getElementById('modal');
  const modalText = document.getElementById('modalText');
  const modalTitle = document.getElementById('modalTitle');

  document.getElementById('btnAccess').addEventListener('click', () => {
    modalTitle.textContent = '// 接入成功';
    modalText.textContent = '神经接口握手完成。欢迎回来，用户 ID: V-2077。你的网络优先级已被提升至最高等级。现在，整座夜之城都在你的数据流掌控之中。';
    modal.classList.add('active');
  });

  document.getElementById('btnInfo').addEventListener('click', () => {
    modalTitle.textContent = '// 系统信息';
    const lines = [
      '> 操作系统：NIGHT-OS v9.2',
      '> 网络状态：已加密连接',
      '> 信号强度：满格',
      '> 防护墙：ACTIVE',
      '> 企业监控：已规避',
      '> 地点：夜之城 · 第4区'
    ];
    modalText.innerHTML = lines.join('<br>');
    modal.classList.add('active');
  });

  document.getElementById('modalClose').addEventListener('click', () => {
    modal.classList.remove('active');
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('active');
  });
</script>

</body>
</html>
