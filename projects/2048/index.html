<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', 'Helvetica Neue', sans-serif;
            background: #faf8ef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 64px;
            font-weight: bold;
            color: #776e65;
        }

        .scores {
            display: flex;
            gap: 8px;
        }

        .score-box {
            background: #bbada0;
            border-radius: 6px;
            padding: 8px 20px;
            text-align: center;
            min-width: 80px;
        }

        .score-box .label {
            font-size: 12px;
            font-weight: bold;
            color: #eee4da;
            text-transform: uppercase;
        }

        .score-box .value {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #776e65;
            font-size: 16px;
        }

        .btn {
            background: #8f7a66;
            color: #f9f6f2;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #9f8b77;
        }

        .game-board {
            position: relative;
            background: #bbada0;
            border-radius: 8px;
            padding: 12px;
            touch-action: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(238, 228, 218, 0.35);
            border-radius: 6px;
        }

        .tiles-container {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
        }

        .tile {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border-radius: 6px;
            transition: top 0.12s ease, left 0.12s ease;
            z-index: 10;
        }

        .tile.merged {
            animation: pop 0.2s ease;
            z-index: 20;
        }

        .tile.new {
            animation: appear 0.2s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes appear {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .game-message {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(238, 228, 218, 0.73);
            border-radius: 8px;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .game-message.active {
            display: flex;
        }

        .game-message.win {
            background: rgba(237, 194, 46, 0.5);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .game-message p {
            font-size: 48px;
            font-weight: bold;
            color: #776e65;
            margin-bottom: 20px;
        }

        .game-message .btn {
            font-size: 18px;
            padding: 12px 30px;
        }

        .tips {
            margin-top: 20px;
            color: #776e65;
            font-size: 14px;
            text-align: center;
            line-height: 1.6;
        }

        @media (max-width: 520px) {
            .container {
                padding: 12px;
            }

            .title {
                font-size: 48px;
            }

            .grid {
                gap: 8px;
            }

            .game-board {
                padding: 8px;
            }

            .tiles-container {
                top: 8px;
                left: 8px;
                right: 8px;
                bottom: 8px;
            }

            .score-box {
                padding: 6px 12px;
                min-width: 65px;
            }

            .score-box .value {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="title">2048</div>
            <div class="scores">
                <div class="score-box">
                    <div class="label">分数</div>
                    <div class="value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="label">最高</div>
                    <div class="value" id="best">0</div>
                </div>
            </div>
        </div>

        <div class="sub-header">
            <div class="subtitle">合并方块，挑战 <strong>2048</strong>！</div>
            <button class="btn" onclick="game.restart()">新游戏</button>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="grid">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div class="tiles-container" id="tilesContainer"></div>
            <div class="game-message" id="gameMessage">
                <p id="messageText"></p>
                <button class="btn" onclick="game.restart()">再来一局</button>
            </div>
        </div>

        <div class="tips">
            💡 使用 <strong>方向键</strong> 或 <strong>触屏滑动</strong> 移动方块
        </div>
    </div>

    <script>
        const TILE_COLORS = {
            2: { bg: '#eee4da', color: '#776e65', size: 1 },
            4: { bg: '#ede0c8', color: '#776e65', size: 1 },
            8: { bg: '#f2b179', color: '#f9f6f2', size: 1 },
            16: { bg: '#f59563', color: '#f9f6f2', size: 1 },
            32: { bg: '#f67c5f', color: '#f9f6f2', size: 1 },
            64: { bg: '#f65e3b', color: '#f9f6f2', size: 1 },
            128: { bg: '#edcf72', color: '#f9f6f2', size: 0.85 },
            256: { bg: '#edcc61', color: '#f9f6f2', size: 0.85 },
            512: { bg: '#edc850', color: '#f9f6f2', size: 0.85 },
            1024: { bg: '#edc53f', color: '#f9f6f2', size: 0.7 },
            2048: { bg: '#edc22e', color: '#f9f6f2', size: 0.7 },
        };

        function getTileStyle(value) {
            return TILE_COLORS[value] || { bg: '#3c3a32', color: '#f9f6f2', size: 0.6 };
        }

        class Game2048 {
            constructor() {
                this.size = 4;
                this.grid = [];
                this.score = 0;
                this.best = parseInt(localStorage.getItem('best2048')) || 0;
                this.won = false;
                this.over = false;
                this.keepPlaying = false;
                this.tileId = 0;
                this.tilesContainer = document.getElementById('tilesContainer');
                this.scoreEl = document.getElementById('score');
                this.bestEl = document.getElementById('best');
                this.messageEl = document.getElementById('gameMessage');
                this.messageText = document.getElementById('messageText');
                this.bestEl.textContent = this.best;

                this.setupInput();
                this.restart();
            }

            restart() {
                this.grid = Array.from({ length: 4 }, () => Array(4).fill(null));
                this.score = 0;
                this.won = false;
                this.over = false;
                this.keepPlaying = false;
                this.scoreEl.textContent = '0';
                this.messageEl.classList.remove('active', 'win');
                this.tilesContainer.innerHTML = '';
                this.addRandomTile();
                this.addRandomTile();
                this.render();
            }

            addRandomTile() {
                const empty = [];
                for (let r = 0; r < 4; r++)
                    for (let c = 0; c < 4; c++)
                        if (!this.grid[r][c]) empty.push({ r, c });
                if (!empty.length) return;
                const { r, c } = empty[Math.floor(Math.random() * empty.length)];
                const value = Math.random() < 0.9 ? 2 : 4;
                this.grid[r][c] = { value, id: ++this.tileId, merged: false, isNew: true };
            }

            getCellSize() {
                const container = this.tilesContainer;
                const w = container.clientWidth;
                const gap = w > 400 ? 12 : 8;
                const cellSize = (w - gap * 3) / 4;
                return { cellSize, gap };
            }

            render() {
                this.tilesContainer.innerHTML = '';
                const { cellSize, gap } = this.getCellSize();

                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        const tile = this.grid[r][c];
                        if (!tile) continue;

                        const style = getTileStyle(tile.value);
                        const el = document.createElement('div');
                        el.className = 'tile' + (tile.merged ? ' merged' : '') + (tile.isNew ? ' new' : '');

                        const fontSize = cellSize * 0.4 * style.size;
                        el.style.cssText = `
          width: ${cellSize}px;
          height: ${cellSize}px;
          top: ${r * (cellSize + gap)}px;
          left: ${c * (cellSize + gap)}px;
          background: ${style.bg};
          color: ${style.color};
          font-size: ${fontSize}px;
        `;
                        el.textContent = tile.value;
                        this.tilesContainer.appendChild(el);

                        tile.merged = false;
                        tile.isNew = false;
                    }
                }
            }

            slide(row) {
                let arr = row.filter(t => t !== null);
                let merged = [];
                let scoreGain = 0;

                for (let i = 0; i < arr.length; i++) {
                    if (i + 1 < arr.length && arr[i].value === arr[i + 1].value) {
                        const newVal = arr[i].value * 2;
                        merged.push({ value: newVal, id: ++this.tileId, merged: true, isNew: false });
                        scoreGain += newVal;
                        i++;
                    } else {
                        merged.push({ value: arr[i].value, id: arr[i].id, merged: false, isNew: false });
                    }
                }

                while (merged.length < 4) merged.push(null);
                return { result: merged, scoreGain };
            }

            move(direction) {
                if (this.over || (this.won && !this.keepPlaying)) return false;

                let moved = false;
                let totalScore = 0;

                const getRow = (i, dir) => {
                    if (dir === 'left') return this.grid[i].slice();
                    if (dir === 'right') return this.grid[i].slice().reverse();
                    if (dir === 'up') return [this.grid[0][i], this.grid[1][i], this.grid[2][i], this.grid[3][i]];
                    if (dir === 'down') return [this.grid[3][i], this.grid[2][i], this.grid[1][i], this.grid[0][i]];
                };

                const setRow = (i, row, dir) => {
                    if (dir === 'left') { this.grid[i] = row; return; }
                    if (dir === 'right') { this.grid[i] = row.reverse(); return; }
                    if (dir === 'up') { for (let j = 0; j < 4; j++) this.grid[j][i] = row[j]; return; }
                    if (dir === 'down') { for (let j = 0; j < 4; j++) this.grid[3 - j][i] = row[j]; return; }
                };

                for (let i = 0; i < 4; i++) {
                    const row = getRow(i, direction);
                    const oldValues = row.map(t => t ? t.value : 0).join(',');
                    const { result, scoreGain } = this.slide(row);
                    const newValues = result.map(t => t ? t.value : 0).join(',');

                    if (oldValues !== newValues) {
                        moved = true;
                        totalScore += scoreGain;
                        setRow(i, result, direction);
                    }
                }

                if (moved) {
                    this.score += totalScore;
                    this.scoreEl.textContent = this.score;
                    if (this.score > this.best) {
                        this.best = this.score;
                        this.bestEl.textContent = this.best;
                        localStorage.setItem('best2048', this.best);
                    }

                    this.addRandomTile();
                    this.render();
                    this.checkGameState();
                }

                return moved;
            }

            checkGameState() {
                // Check win
                if (!this.won && !this.keepPlaying) {
                    for (let r = 0; r < 4; r++)
                        for (let c = 0; c < 4; c++)
                            if (this.grid[r][c] && this.grid[r][c].value === 2048) {
                                this.won = true;
                                this.messageText.textContent = '🎉 你赢了！';
                                this.messageEl.classList.add('active', 'win');
                                return;
                            }
                }

                // Check game over
                if (!this.canMove()) {
                    this.over = true;
                    this.messageText.textContent = '游戏结束！';
                    this.messageEl.classList.add('active');
                }
            }

            canMove() {
                for (let r = 0; r < 4; r++)
                    for (let c = 0; c < 4; c++) {
                        if (!this.grid[r][c]) return true;
                        const v = this.grid[r][c].value;
                        if (c + 1 < 4 && this.grid[r][c + 1] && this.grid[r][c + 1].value === v) return true;
                        if (r + 1 < 4 && this.grid[r + 1][c] && this.grid[r + 1][c].value === v) return true;
                    }
                return false;
            }

            setupInput() {
                // Keyboard
                document.addEventListener('keydown', (e) => {
                    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
                    if (map[e.key]) {
                        e.preventDefault();
                        this.move(map[e.key]);
                    }
                });

                // Touch
                const board = document.getElementById('gameBoard');
                let startX, startY;

                board.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }, { passive: true });

                board.addEventListener('touchend', (e) => {
                    if (!startX || !startY) return;
                    const dx = e.changedTouches[0].clientX - startX;
                    const dy = e.changedTouches[0].clientY - startY;
                    const absDx = Math.abs(dx);
                    const absDy = Math.abs(dy);

                    if (Math.max(absDx, absDy) < 30) return;

                    if (absDx > absDy) {
                        this.move(dx > 0 ? 'right' : 'left');
                    } else {
                        this.move(dy > 0 ? 'down' : 'up');
                    }
                    startX = startY = null;
                }, { passive: true });

                // Handle window resize
                window.addEventListener('resize', () => this.render());
            }
        }

        const game = new Game2048();
    </script>
</body>

</html>
